<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>measure</title>
<style>
  body { margin: 0; background: #111; color: #fff; font: 14px monospace; }
  iframe { display: block; border: 0; }
  #out { padding: 8px; }
</style>
</head>
<body>
<div id="out">waiting</div>
<iframe id="f" scrolling="no"></iframe>
<script>
  var params = new URLSearchParams(location.search);
  var width = Number(params.get('w') || 390);
  var frame = document.getElementById('f');
  var out = document.getElementById('out');
  frame.style.width = width + 'px';
  frame.style.height = '20000px';
  frame.addEventListener('load', function () {
    var doc = frame.contentDocument;
    var link = doc.querySelector('.estimate-actions .button');
    var form = doc.querySelector('.estimate-form');
    if (!link) { out.textContent = 'MEASURE {"error":"no call button"}'; return; }
    var rect = link.getBoundingClientRect();
    var formRect = form.getBoundingClientRect();
    var inner = frame.contentWindow.innerWidth;
    var data = {
      viewport: inner,
      buttonLeft: Math.round(rect.left * 100) / 100,
      buttonRightInset: Math.round((inner - rect.right) * 100) / 100,
      buttonWidth: Math.round(rect.width * 100) / 100,
      formLeft: Math.round(formRect.left * 100) / 100,
      formRightInset: Math.round((inner - formRect.right) * 100) / 100,
      submitText: (doc.querySelector('.estimate-form button[type="submit"]') || {}).textContent || ''
    };
    out.textContent = 'MEASURE ' + JSON.stringify(data);
  });
  frame.src = 'index.html';
</script>
</body>
</html>
